name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crossplane CLI
        env:
          XP_VERSION: v2.3.1
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh" \
            -o /tmp/install.sh
          sh /tmp/install.sh
          sudo install -m 0755 crossplane /usr/local/bin/crossplane
          crossplane --help >/dev/null

      - name: Build package
        run: |
          crossplane xpkg build \
            --package-root=. \
            --examples-root=./examples \
            --ignore=".github/workflows/*.yaml,tests/functions.yaml,tests/*/*.yaml" \
            --package-file=skylab-platform.xpkg

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package to GHCR
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO_LC="${GITHUB_REPOSITORY_OWNER,,}"
          crossplane xpkg push \
            --package-files=skylab-platform.xpkg \
            "ghcr.io/${REPO_LC}/skylab-platform:${TAG}"

      - name: Notify skylab-gitops to run Renovate
        env:
          GH_TOKEN: ${{ secrets.GITOPS_DISPATCH_PAT }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO_LC="${GITHUB_REPOSITORY_OWNER,,}"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_LC}/skylab-gitops/dispatches" \
            -d "$(jq -n --arg pkg "ghcr.io/${REPO_LC}/skylab-platform" --arg ver "$TAG" \
              '{event_type: "ghcr-package-published", client_payload: {package: $pkg, version: $ver}}')"
