name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh" | CHANNEL=stable sh
          sudo mv crossplane /usr/local/bin/
          crossplane version

      - name: Validate XRDs + compositions
        run: ./scripts/validate.sh

      - name: Render examples and diff against expected
        run: ./scripts/render.sh
