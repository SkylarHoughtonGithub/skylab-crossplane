name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crossplane CLI
        env:
          XP_VERSION: v2.3.1
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/crossplane/crossplane/main/install.sh" \
            -o /tmp/install.sh
          sh /tmp/install.sh
          sudo install -m 0755 crossplane /usr/local/bin/crossplane
          crossplane version

      - name: Validate XRDs + compositions
        run: ./scripts/validate.sh

      - name: Render examples and diff against expected
        run: ./scripts/render.sh
