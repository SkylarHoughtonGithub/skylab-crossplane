---
apiVersion: database.skylab.io/v1alpha1
kind: XPostgres
metadata:
  name: example
  namespace: default
spec:
  aws:
    dbSubnetGroupName: example-db-subnets
    vpcSecurityGroupIds:
    - sg-aaaaaaaa
  cloud: aws
  crossplane:
    resourceRefs:
    - apiVersion: rds.aws.upbound.io/v1beta1
      kind: Instance
      name: example-dc2a765da683
  databaseName: app
  passwordSecretRef:
    key: password
    name: example-pg-password
    namespace: default
  region: us-east-1
  storageGB: 20
  username: app
  version: '16'
status:
  conditions:
  - lastTransitionTime: REDACTED
    reason: WatchCircuitClosed
    status: 'True'
    type: Responsive
  - lastTransitionTime: REDACTED
    reason: ReconcileSuccess
    status: 'True'
    type: Synced
  - lastTransitionTime: REDACTED
    message: 'Unready resources: instance'
    reason: Creating
    status: 'False'
    type: Ready
---
apiVersion: rds.aws.upbound.io/v1beta1
kind: Instance
metadata:
  annotations:
    crossplane.io/composition-resource-name: instance
  generateName: example-
  labels:
    crossplane.io/composite: example
  name: example-dc2a765da683
  namespace: default
  ownerReferences:
  - apiVersion: database.skylab.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: XPostgres
    name: example
    uid: e1e3e037-d304-54a2-9f11-553fdaa97b50
spec:
  forProvider:
    allocatedStorage: 20
    dbName: app
    dbSubnetGroupName: example-db-subnets
    engine: postgres
    engineVersion: '16'
    instanceClass: db.t3.micro
    passwordSecretRef:
      key: password
      name: example-pg-password
      namespace: default
    publiclyAccessible: false
    region: us-east-1
    skipFinalSnapshot: true
    storageEncrypted: true
    username: app
    vpcSecurityGroupIds:
    - sg-aaaaaaaa
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: example-conn
    namespace: default
