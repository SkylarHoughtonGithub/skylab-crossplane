apiVersion: compute.skylab.io/v1alpha1
kind: XKubernetesCluster
metadata:
  name: example
  namespace: default
spec:
  cloud: gcp
  region: us-central1-a
  version: "1.30"
  nodeCount: 2
  env: dev
  gcp:
    network: default
    subnetwork: default
    serviceAccount: nodes@my-project.iam.gserviceaccount.com
