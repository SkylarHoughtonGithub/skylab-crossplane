apiVersion: database.skylab.io/v1alpha1
kind: XPostgres
metadata:
  name: example
  namespace: default
spec:
  cloud: gcp
  region: us-central1
  version: "16"
  storageGB: 20
  databaseName: app
  username: app
  passwordSecretRef:
    name: example-pg-password
    namespace: default
    key: password
  gcp:
    network: projects/my-project/global/networks/default
