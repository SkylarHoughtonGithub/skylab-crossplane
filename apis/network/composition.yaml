apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnetworks.network.skylab.io
spec:
  compositeTypeRef:
    apiVersion: network.skylab.io/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
    - step: render-cloud-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $cloud := $xr.spec.cloud -}}
            {{- $region := $xr.spec.region -}}
            {{- $cidr := default "10.0.0.0/16" $xr.spec.cidrBlock -}}
            {{- $subnetCidr := default "10.0.1.0/24" $xr.spec.subnetCidr -}}
            {{- if eq $cloud "aws" }}
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: VPC
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: vpc
            spec:
              forProvider:
                region: {{ $region }}
                cidrBlock: {{ $cidr }}
                enableDnsHostnames: true
                enableDnsSupport: true
              providerConfigRef:
                name: default
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: InternetGateway
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: igw
            spec:
              forProvider:
                region: {{ $region }}
                vpcIdSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Subnet
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: subnet-public
            spec:
              forProvider:
                region: {{ $region }}
                cidrBlock: {{ $subnetCidr }}
                mapPublicIpOnLaunch: true
                vpcIdSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTable
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: rt-public
            spec:
              forProvider:
                region: {{ $region }}
                vpcIdSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: Route
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: route-public-default
            spec:
              forProvider:
                region: {{ $region }}
                destinationCidrBlock: 0.0.0.0/0
                routeTableIdSelector:
                  matchControllerRef: true
                gatewayIdSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            ---
            apiVersion: ec2.aws.upbound.io/v1beta1
            kind: RouteTableAssociation
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: rta-public
            spec:
              forProvider:
                region: {{ $region }}
                routeTableIdSelector:
                  matchControllerRef: true
                subnetIdSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            {{- else if eq $cloud "gcp" }}
            ---
            apiVersion: compute.gcp.upbound.io/v1beta1
            kind: Network
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: network
            spec:
              forProvider:
                autoCreateSubnetworks: false
              providerConfigRef:
                name: default
            ---
            apiVersion: compute.gcp.upbound.io/v1beta1
            kind: Subnetwork
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: subnet
            spec:
              forProvider:
                region: {{ $region }}
                ipCidrRange: {{ $subnetCidr }}
                networkSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: default
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
